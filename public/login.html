<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100e1c">
  <title>登录 · 星途之旅</title>
  <link rel="icon" href="/assets/star.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="shell">
    <header class="site-header">
      <div class="brand">
        <span class="brand-mark"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 1.8 14.9 9l7.3 3-7.3 2.9-2.9 7.3-2.9-7.3L1.8 12l7.3-3z" fill="currentColor" stroke="none"/></svg></span>
        <span><strong>LUMA TRAIL</strong><small>星途之旅</small></span>
      </div>
    </header>
    <main class="login-stage">
      <div class="login-intro">
        <div class="kicker"><span></span><span>TRAVELER’S GATE</span></div>
        <h1>月光之门</h1>
        <p>穿过三片梦境，击败曙光守卫。</p>
      </div>
      <section class="login-panel" aria-labelledby="login-title" data-login-panel>
        <div class="eyebrow">TRAVELER SIGN-IN</div>
        <h2 id="login-title">登录旅程</h2>
        <p>输入账号和密码，开启你的冒险。</p>
        <p class="login-reward">
          <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v8h14v-8M12 8v12m0-12H8a2.5 2.5 0 1 1 2.5-2.5zM12 8h4a2.5 2.5 0 1 0-2.5-2.5z"/></svg>
          <span>通关后，惊喜大礼等你解锁。</span>
        </p>
        <form class="login-form" method="post" action="/login">
          <p class="form-success" role="status" data-register-success hidden>账号已创建，请使用注册的用户名和密码登录。</p>
          <p class="form-error" role="alert" data-login-error hidden>用户名或密码有误，请检查后重试。</p>
          <label for="username">用户名</label>
          <input id="username" name="username" type="text" autocomplete="username" maxlength="64" required>
          <label for="password">密码</label>
          <input id="password" name="password" type="password" autocomplete="current-password" maxlength="64" required>
          <button class="primary" type="submit">登录并进入游戏<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></svg></button>
        </form>
        <p class="login-switch">还没有账号？ <a href="/register">注册账号</a></p>
      </section>
      <section class="login-panel" aria-labelledby="register-title" data-register-panel hidden>
        <div class="eyebrow">TRAVELER SIGN-UP</div>
        <h2 id="register-title">注册账号</h2>
        <p>创建你的旅人账号，开启冒险。</p>
        <form class="login-form" method="post" action="/register">
          <p class="form-error" role="alert" data-register-error hidden></p>
          <label for="register-username">用户名</label>
          <input id="register-username" name="username" type="text" autocomplete="username" minlength="2" maxlength="64" required>
          <label for="register-password">密码</label>
          <input id="register-password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="64" aria-describedby="password-hint" required>
          <p id="password-hint" class="form-hint">使用 8 至 64 个字符。</p>
          <label for="register-confirmation">确认密码</label>
          <input id="register-confirmation" name="confirmation" type="password" autocomplete="new-password" minlength="8" maxlength="64" required>
          <button class="primary" type="submit">创建账号<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></svg></button>
        </form>
        <p class="login-switch">已有账号？ <a href="/login">返回登录</a></p>
      </section>
    </main>
    <footer class="site-footer login-footer"><span>LUMA TRAIL <i></i> 星途之旅</span></footer>
  </div>
</body>
</html>
